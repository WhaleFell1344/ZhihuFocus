<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ZhihuFocus</title>

    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
</head>
<body>
    <main>
        <img src="../Icon.png" width="80" height="80" alt="">
        <h1>ZhihuFocus</h1>
        <p>在 Safari 中专注阅读知乎与豆瓣。</p>
        <p class="platform-ios">打开系统“设置”，搜索 Safari，进入“扩展”，开启 ZhihuFocus。</p>
        <p class="platform-mac state-unknown">在 Safari 的“设置 → 扩展”中开启 ZhihuFocus。</p>
        <p class="platform-mac state-on">扩展已开启，可以返回 Safari 阅读。</p>
        <p class="platform-mac state-off">扩展尚未开启，请在 Safari 设置中开启。</p>
        <button class="platform-mac open-preferences" type="button">打开 Safari 设置并退出</button>
        <p class="hint">允许访问知乎和豆瓣后，刷新网页即可使用。点 Safari 中的扩展图标可切换主题。</p>
        <p class="platform-ios hint">如果网页显示手机版，可在 Safari 页面菜单中选择“请求桌面网站”。</p>
    </main>
</body>
</html>
